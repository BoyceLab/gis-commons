site_name: GIS Commons
site_description: Geographic information systems, maps, environmental exposure research, and data standards for ALS and other neurodegenerative diseases.
site_url: https://boycelab.github.io/gis-commons/
copyright: Content CC BY 4.0. Maps and stories retain their original credits.
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  font: false
extra_css: [assets/extra.css]
extra_javascript: [assets/extra.js]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - toc: {permalink: true, toc_depth: 3}
# Exclude legacy private pages even when an update is copied over older files.
exclude_docs: |
  board/
  study/
  downloads/
  assets/GeOALS_Study_Overview_2026-11-13.png
plugins:
  - search
nav:
  - Home: index.md
  - Learn GIS:
      - GIS in plain language: start/gis-basics.md
      - Learning paths by role: start/learning-paths.md
      - Glossary: start/glossary.md
      - ArcGIS tools and training: esri/tools.md
      - Crediting maps and software: esri/credits.md
  - Maps and stories:
      - GeOALS maps and apps: maps/tools.md
      - StoryMaps: maps/storymaps.md
      - Video gallery: maps/videos.md
  - Environmental mapping:
      - Overview and study design: environment/overview.md
      - Exposure examples: environment/examples.md
      - Data sources and linkage limits: environment/data-sources.md
      - References and provenance: environment/references.md
  - Standards:
      - The standards stack: standards/overview.md
      - Communities to join: standards/communities.md
  - Work and volunteer:
      - Overview: work/index.md
      - Research and communication services: work/services.md
      - Volunteer roles: work/volunteer.md
      - Awareness toolkit: work/awareness.md
      - Training with GeOALS: grants/training.md
      - Project and grant toolkit:
          - Working together on a grant: grants/index.md
          - Project ideas: grants/starter-ideas.md
          - Proposal language: grants/language.md
          - Budget and letters: grants/budget.md
          - Request checklist: grants/checklist.md
  - About:
      - About GIS Commons: about/index.md
      - Location privacy: governance/privacy.md
      - Acknowledgements and sources: about/acknowledgements.md
      - Suggest a resource or correction: about/contribute.md
